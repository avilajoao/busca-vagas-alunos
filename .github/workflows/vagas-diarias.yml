name: Busca Diaria de Vagas LATAM

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositorio
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar buscador de vagas
      run: python buscador_vagas.py

- name: Salvar relatorio e historico no repositorio
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add VAGAS_DO_DIA.md historico_vagas.json
        git commit -m "Auto-update: Vagas do dia e historico" || echo "Sem alteracoes para comitar"
        git push origin main --force
 
