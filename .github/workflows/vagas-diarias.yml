name: Busca Diaria de Vagas LATAM

on:
  schedule:
    # Roda diariamente às 06:00 (Horário de Brasília)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar buscador de vagas
      run: python buscador_vagas.py

    - name: Salvar relatorio no repositorio
      run: |
        git config --global user.name "Bot Buscador de Vagas"
        git config --global user.email "bot@github.com"
        git add VAGAS_DO_DIA.md
        git commit -m "Auto-update: Vagas do dia $(date +'%d/%m/%Y')" || exit 0
        git push
